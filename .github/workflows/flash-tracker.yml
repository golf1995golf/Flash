name: Flash parcel tracker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flash-parcel-tracker
  cancel-in-progress: false
jobs:
  check-parcel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/flash-tracker/requirements.txt
      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: tools/flash-tracker/state.json
          key: flash-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flash-tracker-state-
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r tools/flash-tracker/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check parcel and notify Telegram
        run: python tools/flash-tracker/flash_tracker.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/flash-tracker/state.json
          key: flash-tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
